plugins {
 id 'java'
 id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}
group = 'dev.titantech'
version = '1.0.0'
base { archivesName = 'block-hardness-tooltip' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft { mappings channel: 'official', version: '1.20.1' }
repositories { maven { url 'https://maven.minecraftforge.net' }; mavenCentral() }
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.4.10' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
