name: DeskPilot Windows EXE
on:
  push:
    branches: [deskpilot-windows-build]
    paths:
      - 'DeskPilot/**'
      - '.github/workflows/deskpilot-windows.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: DeskPilot
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test core on Windows
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build EXE
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name DeskPilot --collect-all keyring --hidden-import keyring.backends.Windows --collect-all pyautogui --collect-all keyboard app.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke test packaged GUI
        run: |
          $appProcess = Start-Process -FilePath '.\dist\DeskPilot.exe' -ArgumentList '--smoke-test' -PassThru
          if (-not $appProcess.WaitForExit(45000)) {
            Stop-Process -Id $appProcess.Id -Force
            throw 'Packaged GUI failed to exit after smoke test'
          }
          if ($appProcess.ExitCode -ne 0) { throw "GUI exit code: $($appProcess.ExitCode)" }
      - name: Record hash and resolved dependencies
        run: |
          (Get-FileHash dist/DeskPilot.exe -Algorithm SHA256).Hash | Out-File dist/SHA256.txt -Encoding utf8
          python -m pip freeze | Out-File dist/dependencies.txt -Encoding utf8
          Copy-Item README_RU.md dist/README_RU.md
      - uses: actions/upload-artifact@v4
        with:
          name: DeskPilot-Windows-x64
          path: |
            DeskPilot/dist/DeskPilot.exe
            DeskPilot/dist/SHA256.txt
            DeskPilot/dist/dependencies.txt
            DeskPilot/dist/README_RU.md
          if-no-files-found: error
          retention-days: 30
