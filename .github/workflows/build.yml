name: Build Block Hardness Tooltip
on:
  push:
    branches: [block-hardness-tooltip]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Compile
        run: gradle build --stacktrace --no-daemon
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: block-hardness-tooltip
          path: build/libs/*.jar
          if-no-files-found: error
